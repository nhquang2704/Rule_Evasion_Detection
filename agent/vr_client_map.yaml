# Map hostname → Velociraptor client_id.
#
# Khi alert đến với `host.name: WIN-01`, Forensic Agent sẽ resolve sang
# Velociraptor client_id để query đúng máy.
#
# Cách tìm client_id:
#   1. Mở Velociraptor GUI (https://localhost:8889)
#   2. Vào tab "Clients" → click vào host
#   3. Copy chuỗi dạng "C.1a2b3c4d5e6f7g8h"
#
# Khi chưa cài Velociraptor (mock mode): file này có thể để trống.

